<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassAndId</title>
    <style>
        .a1 {
            font-style: italic;
        }
        #b1 {
            text-decoration: underline;
        }
        #c1 {
            text-decoration: solid;
            font-weight: 700;
        }
             
     </style>
</head>

<body>
    <h1 class="a1">Hello World</h1>
    <h2 class="a1">Welcome to my html page</h2>
    <table border="1" cellspacing="15" cellpadding="20">
        <tr id="b1">
            <th>Name</th>
            <th>Class</th>
        </tr>
        <tr>
            <td id="c1">xyz</td>
            <td>8</td>

        </tr>

    </table>
</body>

</html>
