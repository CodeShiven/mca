<!DOCTYPE html>
<html>

<head>
    <style>
        .container {
            display: grid;
            grid-template-areas:
                "header header"
                "menu content"
                "footer footer";
            grid-template-columns: 1fr 3fr;
            gap: 3px;
            background-color: rgb(117, 172, 227);
            padding: 5px;

        }

        .h1 {
            color: rgb(255, 46, 46);
            text-decoration: underline;
        }

        .container div {
            background-color: white;
            padding: 10px;
        }

        .header {
            grid-area: header;
            text-align: center;
        }

        .container div.menu {
            grid-area: menu;
        }

        .container div.content {
            grid-area: content;

        }

        .footer {
            grid-area: footer;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="h1">
        <h1 align="center">Grid Layout</h1>
    </div>

    <h1 align="center">ABES Engineering College</h1>
    <h2 align="center">MCA Department</h2>

    <div class="container">
        <div class="header">
            <h2>WELCOME TO ABESEC</h2>
        </div>
        <div class="content">
            <table border="0" align="center">
                <tr>
                    <td>Email </td>
                    <td><input type="email" name="email"></td>
                </tr>
                <tr>
                    <td>Password</td>
                    <td><input type="password" name="password"></td>
                </tr>
                <tr>
                    <td></td>
                    <td><input type="submit" value="Login"></td>
                </tr>
            </table>
        </div>
        <div class="footer">
            <h4>Footer</h4>
        </div>
    </div>

</body>

</html>
