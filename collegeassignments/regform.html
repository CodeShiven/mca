<!DOCTYPE html>
<html>
<head>   
    <title>Register</title>
</head>

<body>
    <div >        
        <h1 ><u>Registration Form</u></h1>
        <form action="Register.php" method="post">
            <table>
                <tr>
                    <td>
                        <label for="Name">Name:</label>
                    </td>
                    <td>
                        <input type="text" id="Name">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label >Gender:</label>
                    </td>
                    <td >
                        <input type="radio" name="gen" id="male" value="male">
                        <label for="male">Male</label>
                        <input type="radio" name="gen" id="female" value="female">
                        <label for="female">Female</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>Preferred Languages:</label>
                    </td>
                    <td>
                        <input id="c1" name="cb1" type="checkbox">
                        <label for="c1">Hindi</label>
                        <input id="c2" type="checkbox" name="cb1">
                        <label for="c2">English</label>
                        
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="category">Category:</label>
                    </td>
                    <td>
                        <select name="categoty" id="category">
                            <option value="gen">General</option>
                            <option value="obc">OBC</option>
                            <option value="sc">SC</option>
                            <option value="st">ST</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="exp">Short Introduction:</label></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <textarea name="Intro" id="exp" rows="3" cols="40" ></textarea>
                    </td>
                </tr>
                <tr>
                    <td>

                        <label for="number">Phone No.:</label>
                    </td>
                    <td>
                        <input id="number" name="phone" type="number">
                    </td>
                </tr>
                <tr>
                    <td>
                        
                        <label for="mail">Email:</label>
                    </td>
                    <td>
                        <input id="mail" name="mail" type="email"  >
                    </td>
                </tr>
                <tr>
                    <td>
                        
                        <label  for="pass">Password:</label>
                    </td>
                    <td>
                        <input id="pass" name="password" type="password">
                    </td>
                </tr>
                <tr >
                    <td style="text-align: center;" colspan="2">
                        <button type="submit" >Register</button>
                    </td>
                </tr>
                
            </table>
        </form>
    </div>
</body>

</html>
