<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        body {
            background-color: black;
            margin: 0;

        }

        .navi {
            display: flex;
            border-radius: 7px;
            align-items: center;
            justify-content: space-between;
            font-family: cursive;
            padding: 16px 24px;
        }

        .logo {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo img {
            width: 70px;
            height: auto;
            /* If your logo is a PNG/JPG, use a filter to make it appear white */
            filter: brightness(0) invert(1);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 75px;
        }

        .links {
            text-decoration: none;
            font-size: 17px;
            color: aliceblue;
            padding: 8px 0;
        }

        .hero {
            display: flex;
            align-items: center;
            gap: 190px;
            /* space between photo and text */
            padding: 20px;
        }

        .left {
            display: flex;
        }

        .left img {
            width: 320px;
            max-width: 100%;
            height: auto;
            border-radius: 25px;
            display: block;
            margin-top: 80px;
            margin-left: 150px;
        }

        .right {
            display: flex;
            flex-direction: column;
            color: aliceblue;
            font-size: xx-large;
            margin-top: 85px;
        }

        .about {
            color: aliceblue;
            display: flex;
            padding: 20px;
            justify-content: flex-start;
        }

        .skills {
            display: flex;
            margin-left: 75px;
            gap: 210px;
            padding: 0 20px 20px;
            align-items: center;
        }

        .card {
            display: flex;
        }

        .card a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: aliceblue;
            text-decoration: none;
            font-family: cursive;
        }

        .card img {
            width: 85px;
            height: auto;
            display: block;
        }
        .foot{
            background-color: rgba(0, 0, 0, 0.36);
            color: aliceblue;
            display: flex;
            justify-content: center;
            font-size: xx-large;
        }
        

    </style>

</head>

<body>
    <header>
        <nav class="navi">
            <a class="logo" href="#">
                <img src="alphabet.png" alt="logo">
            </a>
            <div class="nav-links">
                <a class="links" href="#">Home</a>
                <a class="links" href="#">About</a>
                <a class="links" href="#">Skills</a>
                <a class="links" href="#">Contact</a>
            </div>
        </nav>
    </header>
    <hr style="color: aliceblue;height:0.1px;">
    <section class="hero">
        <div class="left">
            <img src="mypic.png" alt="myimage">
        </div>
        <div class="right">
            <p>Hi, I'm Shivendra and <br> i am a web <br>Developer.</p>
            <p>Lorem ipsum, dolor sit amet consectetur
                adipisicing elit.sdas dad awdaw awwd </p>
        </div>
    </section>
    <hr style="color: aliceblue;height:0.1px;">
    <h2 class="about">About My Skills:-</h2>

    <div class="skills">
        <div class="card">
            <a href="#"><img src="c-logo-icon-28389.png" alt="C++ logo">C++</a>
        </div>
        <div class="card">
            <a href="#"><img src="html-5.png" alt="HTML logo">HTML</a>
        </div>
        <div class="card">
            <a href="#"><img src="css-3.png" alt="CSS logo">CSS</a>
        </div>
        <div class="card">
            <a href="#"><img src="js.png" alt="JavaScript logo">JavaScript</a>
        </div>
        <div class="card">
            <a href="#"><img src="Git.png" alt="Git logo">Git</a>
        </div>
    </div>
    <hr style="color: aliceblue;">
    <footer class="foot">
        Thanks for coming
    </footer>



</body>

</html>
