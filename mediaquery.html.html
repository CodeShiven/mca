<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <style>
        body {
            background-color: lightblue;
            text-align: center;
            padding-top: 50px;
        }

        @media  (max-width: 600px) {
            body {
                background-color: lightgreen;
            }
        }
    </style>
</head>
<body>
       <h1>Using Media Query and testing it.</h1> 
       <p>The background color will change from lightblue to lightgreen</p>
</body>
</html>
