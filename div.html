<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .abes{
            background-color: aqua;
            color: brown;
            text-align: center;
            font-size: 120%;
        }
        .abes1{
            background-color: blanchedalmond;
            color: palevioletred;
            text-align: center;
        }
        .abes2{
        background-color: palegreen;
        color: brown;
        text-align: center;
    }
    </style>
</head>
<body>
    <div class="abes">
        <h1>Abes Engineering COLLEGE</h1>
    </div>
    <div class="abes1">
        <h1>Students</h1>
    </div>
    <div class="abes2">
        <h1>Staff</h1>
    </div>
    
    <!-- Radio button demo -->
    <section style="margin:20px; text-align:center;">
        <fieldset style="display:inline-block; text-align:left; padding:12px;">
            <legend>Select your department</legend>

            <input type="radio" id="dept-cse" name="dept" value="CSE">
            <label for="dept-cse">Computer Science (CSE)</label><br>

            <input type="radio" id="dept-me" name="dept" value="ME">
            <label for="dept-me">Mechanical (ME)</label><br>

            <input type="radio" id="dept-ee" name="dept" value="EE" checked>
            <label for="dept-ee">Electrical (EE)</label>
        </fieldset>

        <div style="margin-top:12px;">
            <button id="showDept">Show selected department</button>
            <span id="result" style="margin-left:12px; font-weight:bold"></span>
        </div>
    </section>

    <script>
    document.getElementById('showDept').addEventListener('click', function () {
        const sel = document.querySelector('input[name="dept"]:checked');
        const out = document.getElementById('result');
        out.textContent = sel ? sel.value : 'No selection';
    });
    </script>
       
</body>
</html>
